server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — any unknown path falls back to index.html
    # (so React Router or refreshing on /admin doesn't 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the API Gateway
    # 'api-gateway' is the service name from docker-compose.yml
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api-gateway:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets aggressively (they're hashed by Vite's build)
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}