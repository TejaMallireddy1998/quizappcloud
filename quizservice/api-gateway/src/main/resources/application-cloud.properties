# Disable Eureka entirely
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable discovery-based routing
spring.cloud.gateway.discovery.locator.enabled=false

# Explicit routes ? match the paths your frontend uses
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=question-service
spring.cloud.gateway.routes[1].uri=${QUESTION_SERVICE_URL}
spring.cloud.gateway.routes[1].predicates[0]=Path=/question-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=quiz-service
spring.cloud.gateway.routes[2].uri=${QUIZ_SERVICE_URL}
spring.cloud.gateway.routes[2].predicates[0]=Path=/quiz-service/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1