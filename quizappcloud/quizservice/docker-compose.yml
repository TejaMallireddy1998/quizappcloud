
services:
  postgres:
    image: postgres:16-alpine
    container_name: quizapp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quizapp-net

  eureka:
    build: ./service-registry
    container_name: quizapp-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - quizapp-net

  auth-service:
    build: ./auth-service
    container_name: quizapp-auth
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - quizapp-net

  question-service:
    build: ./question-service
    container_name: quizapp-question
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: questiondb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - quizapp-net

  quiz-service:
    build: ./quiz-service
    container_name: quizapp-quiz
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: quizdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      question-service:
        condition: service_started
    networks:
      - quizapp-net

  api-gateway:
    build: ./api-gateway
    container_name: quizapp-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka:
        condition: service_healthy
      auth-service:
        condition: service_started
      question-service:
        condition: service_started
      quiz-service:
        condition: service_started
    networks:
      - quizapp-net

  frontend:
    build: ./quiz-frontend
    container_name: quizapp-frontend
    ports:
      - "8080:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - quizapp-net

networks:
  quizapp-net:
    driver: bridge

volumes:
  postgres-data: